<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录/注册 - 自留诗集</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:serif;}
    body{background:#f3efe4;color:#333;min-height:100vh;}
    header{background:#2b2b24;color:#fff;padding:16px 24px;display:flex;justify-content:center;gap:32px;}
    header a{color:#ddd;text-decoration:none;}
    header a.active{color:#fff;border-bottom:1px solid #fff;}
    .box{width:420px;margin:80px auto;background:#fff;padding:40px;border-radius:12px;}
    h2{text-align:center;margin-bottom:8px;font-weight:normal;}
    .tip{text-align:center;color:#666;margin-bottom:30px;}
    .item{margin-bottom:18px;}
    input{width:100%;padding:10px 12px;border:1px solid #ccc;border-radius:6px;font-size:15px;}
    button{width:100%;padding:12px;border:none;background:#2b2b24;color:#fff;border-radius:6px;font-size:16px;cursor:pointer;}
    .switch{text-align:center;margin-top:16px;color:#555;}
    .switch a{color:#5c4b38;}
    footer{text-align:center;margin-top:80px;color:#888;font-size:14px;}
  </style>
</head>
<body>
<header>
  <a href="./index.html">首页</a>
  <a href="./collections.html">诗集</a>
  <a href="./notes.html">感言墙</a>
  <a href="./auth.html" class="active">登录</a>
</header>
<div class="box">
  <h2>登录</h2>
  <div class="tip">欢迎回来</div>
  <div class="item">
    <input type="email" id="email" placeholder="your@email.com">
  </div>
  <div class="item">
    <input type="password" id="pwd" placeholder="至少6位密码">
  </div>
  <button id="loginBtn">登录</button>
  <div class="switch">还没有账号？<a href="#" id="toReg">立即注册</a></div>
</div>
<footer>© 自留诗集 · 以诗会友</footer>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@3/+esm'
const SUPABASE_URL = "https://tstbbalphdxtilvldnsr.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_rHTcX_Y10AYxb5Vc9r0hqg_nR77Bjle";
const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

const loginBtn = document.getElementById('loginBtn');
const toReg = document.getElementById('toReg');

loginBtn.onclick = async ()=>{
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('pwd').value.trim();
  const {error} = await supabase.auth.signInWithPassword({email,password});
  if(error) {
    alert(error.message);
    return;
  }
  if(confirm("登录成功！")){
    location.href = "./index.html";
  }
}

toReg.onclick = (e)=>{
  e.preventDefault();
  loginBtn.innerText = "注册";
  document.querySelector("h2").innerText = "注册";
  document.querySelector(".tip").innerText = "创建账号";
  toReg.innerText = "已有账号？去登录";
  toReg.onclick = (e)=>{
    e.preventDefault();
    location.reload();
  }
  loginBtn.onclick = async ()=>{
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('pwd').value.trim();
    const {error} = await supabase.auth.signUp({email,password});
    if(error) {
      alert(error.message);
      return;
    }
    alert("注册成功，请去邮箱验证！");
  }
}
</script>
</body>
</html>
